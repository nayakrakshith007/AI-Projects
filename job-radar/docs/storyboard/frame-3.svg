<text x="259" y="154" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">8 workers</text>
<text x="259" y="174" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">1 request / host / s</text>
