<rect x="14" y="14" width="852" height="312" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="52" cy="52" r="20" fill="#1f6feb"/>
<text x="52" y="59" font-size="20" fill="#fff" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">3</text>
<text x="84" y="50" font-size="12" fill="#8b949e" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">FRAME 3  ·  THE AUTOMATION</text>
<text x="84" y="74" font-size="24" fill="#e6edf3" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The morning run</text>
<text x="500" y="130" font-size="16" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">At 08:30 the runner wakes up by</text>
<text x="500" y="158" font-size="16" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">itself and reads every source,</text>
<text x="500" y="186" font-size="16" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">politely and in parallel.</text>
<text x="500" y="214" font-size="16" fill="#58a6ff" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">→ No tokens, no logins, no stealth.</text>
